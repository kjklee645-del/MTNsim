[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtnsim"
version = "0.1.0"
description = "Microscopic traffic noise simulation platform"
readme = "MTNsim_PRD_draft.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
