[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtnsim"
version = "0.1.0"
description = "Microscopic traffic noise simulation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = ["defusedxml>=0.7.1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[project.optional-dependencies]
gui = ["PySide6>=6.7", "pyqtgraph>=0.13"]

[project.scripts]
mtnsim = "mtnsim.app.main:main"
mtnsim-gui = "mtnsim.gui.app:main"
