[scenario]
name = "lane_change_enforce"
description = "Lane-change enforcement scenario based on the baseline 4-lane case"
project = "mtnsim-demo"

[traffic]
max_vehicles = 100
vehicle_types = ["vType1", "vType2"]
vehicle_weights = [50, 50]
start_mode = "interval"
vehicle_interval_seconds = 5
start_speed_kmh = 100
route_types = ["r_1"]

[controls]
lane_change_mode = "enforce"
lane_change_ratio = 1.0
lane_change_strategy = "custom"
lane_change_force_change = true
lane_change_check_radius_meters = 20
lane_change_restore_time_seconds = 10
target_lane_index = 3
designated_lane = 0
lane_change_target_positions = [[500.0, 0.0]]
post_distance_speed_control = true
post_distance_meters = 300
post_target_speed_kmh = 100

[noise]
background_noise_db = 40
max_area_meters = 400
grid_size_meters = 5
receiver_height_meters = 1.5

[noise.vehicle_coefficients.vType1]
a = 44.4
b = 31.5

[noise.vehicle_coefficients.vType2]
a = 51.2
b = 31.0

[grid]
margin_x_start = 50
margin_x_end = 50
extra_y_extent = 230

[[receivers]]
id = "poi_500_25"
x = 500.0
y = 25.0
z = 1.5

[[receivers]]
