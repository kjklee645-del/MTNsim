[scenario]
name = "baseline"
description = "Base scenario for 4-lane test road"
project = "mtnsim-demo"

[traffic]
max_vehicles = 2
vehicle_types = [ "vType1", "vType2",]
vehicle_weights = [ 50, 50,]
start_mode = "interval"
vehicle_interval_seconds = 5.0
start_speed_kmh = 100.0
route_types = [ "r_1",]

[controls]
lane_change_mode = "disable"
lane_change_ratio = 1.0
lane_change_strategy = "custom"
lane_change_force_change = true
lane_change_check_radius_meters = 20
lane_change_restore_time_seconds = 10
target_lane_index = 3
designated_lane = 0
lane_change_target_positions = [ [ 500.0, 0.0,],]
post_distance_speed_control = true
post_distance_meters = 300.0
post_target_speed_kmh = 100.0

[noise]
background_noise_db = 40.0
max_area_meters = 100.0
grid_size_meters = 5.0
receiver_height_meters = 1.5

[grid]
margin_x_start = 50.0
margin_x_end = 50.0
extra_y_extent = 230.0
override_enabled = false

[noise.directivity]
preset = "custom"
mode = "isotropic"
response_profile = "enhanced"
strength_db = 30.0
wedge_angle_deg = 85.0
vertical_strength_db = 2.0
vertical_angle_deg = 65.0

[noise.vehicle_coefficients.vType1]
a = 44.4
b = 31.5

[noise.vehicle_coefficients.vType2]
a = 51.2
b = 31.0
